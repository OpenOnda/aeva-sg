<body>

<main>
  <section class="soon">
    <div class="icon" id="cs-icon"></div>

    <h1 style="margin-top:20px">Coming soon</h1>
    <span class="tag-rule" aria-hidden="true"></span>
    <p id="cs-text">We're putting the finishing touches on this channel.<br class="cs-br"> In the meantime, come say hello on Instagram.</p>
    <div class="actions">
      <a href="https://instagram.com/aevacarpentry" target="_blank" rel="noopener" class="btn solid">Follow @aevacarpentry</a>

    </div>
  </section>

<footer id="site-footer"></footer>

<script src="vendor/lenis.min.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="projects.js"></script>
<script src="main.js"></script>
<script>
AEVA.ready.push(() => {
  const names = { tiktok: "TikTok", youtube: "YouTube", facebook: "Facebook" };
  const k = new URLSearchParams(location.search).get("p");
  if (names[k]) {
    document.getElementById("cs-label").textContent = "AEVA on " + names[k];
    document.getElementById("cs-icon").innerHTML = ICONS[k];
    document.title = `${names[k]} coming soon | AEVA`;
  }
});
</script>
