<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设计 | AEVA</title>
<meta name="description" content="AEVA 设计。">
<meta name="robots" content="noindex, follow">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
<meta name="theme-color" content="#13100d">
<link rel="icon" href="../images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<main>
  <section class="proj-hero">
    <div class="phero" style="padding:0 0 4vh"><div class="top"><a href="designs.html" class="link">全部设计 <span class="arr"></span></a><span class="label" id="p-loc"></span></div></div>
    <h1 data-split="hero" id="p-title"></h1>
    <div class="facts" id="p-facts"></div>
  </section>

  <figure class="full"><div class="ph" id="p-img1"><i></i></div></figure>

  <section class="story">
    <span class="label gold">设计理念</span>
    <div>
      <p class="big" data-scrub id="p-summary"></p>
      <p style="margin-top:6vh;max-width:40em" data-fade id="p-story"></p>
    </div>
  </section>

  <section class="pair">
    <div class="ph" data-reveal data-speed=".08" id="p-img2"><i></i></div>
    <div class="ph" data-reveal data-speed="-.08" id="p-img3"><i></i></div>
  </section>

  <section class="scope">
    <span class="label gold">我们会打造</span>
    <ul id="p-scope"></ul>
  </section>

  <section class="contact" style="padding-top:4vh">
    <h2 data-split>想把它<span class="gold-txt">搬进你家吗？</span></h2>
    <a href="#" data-wa-design class="btn solid">就这个设计 WhatsApp 我们</a>
  </section>

  <a class="next" id="p-next" data-cursor="下一个">
    <div class="ph"><i></i></div>
    <div class="in"><span class="label">下一个设计</span><h2 id="p-next-title"></h2></div>
  </a>
</main>

<footer id="site-footer"></footer>

<script src="../vendor/lenis.min.js"></script>
<script src="../vendor/gsap.min.js"></script>
<script src="../vendor/ScrollTrigger.min.js"></script>
<script src="../projects-zh.js"></script>
<script src="../main.js"></script>
<script>
AEVA.ready.push(() => {
  const q = new URLSearchParams(location.search).get("d");
  const slug = document.body.dataset.slug || q;
  if (!document.body.dataset.slug) { location.replace(q ? `design-${q}.html` : "designs.html"); return; }
  const i = Math.max(0, PROJECTS.findIndex((x) => x.slug === slug));
  const p = PROJECTS[i], n = PROJECTS[(i + 1) % PROJECTS.length];
  const img = (s, k) => `url('../images/projects/${s}-${k}.jpg')`;
  document.getElementById("p-title").textContent = p.title;
  document.getElementById("p-loc").textContent = p.space;
  document.getElementById("p-facts").innerHTML = `
    <div><span>空间</span><b>${p.space}</b></div>
    <div><span>适合</span><b>${p.suits}</b></div>
    <div><span>材料</span><b>${p.style}</b></div>
    <div><span>一般工期</span><b>${p.build}</b></div>`;
  document.getElementById("p-summary").textContent = p.summary;
  document.getElementById("p-story").textContent = p.story;
  ["p-img1", "p-img2", "p-img3"].forEach((id, k) => document.querySelector(`#${id} i`).style.setProperty("--img", img(p.slug, k + 1)));
  document.getElementById("p-scope").innerHTML = p.scope.map((s, k) => `<li><span class="num">0${k + 1}</span>${s}</li>`).join("");
  const nx = document.getElementById("p-next");
  document.querySelectorAll("[data-wa-design]").forEach((a) => { a.href = `https://wa.me/6580405577?text=${encodeURIComponent(`你好 AEVA，我喜欢「${p.title}」这个设计，想了解更多...`)}`; a.target = "_blank"; a.rel = "noopener"; });
  nx.href = `design-${n.slug}.html`;
  nx.querySelector("i").style.setProperty("--img", img(n.slug, 1));
  document.getElementById("p-next-title").textContent = n.title;
});
</script>
</body>
</html>
